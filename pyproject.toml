[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "earcon"
version = "0.1.4"
description = "A self-evolving memory proxy for OpenAI-compatible clients: any LLM app gets experience-driven learning by changing one baseURL."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["llm", "agents", "memory", "self-improvement", "jitrl", "proxy", "reinforcement-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
desktop = ["pywebview>=5.0"]
dev = ["pytest>=7.0"]

[project.scripts]
earcon = "earcon.cli:main"

[tool.setuptools.packages.find]
include = ["earcon*"]

[tool.setuptools.package-data]
"earcon.gateway" = ["static/*"]
